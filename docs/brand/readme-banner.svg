<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="520" viewBox="0 0 1760 520">
  <style>@font-face{font-family:ArchivoX;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:BricoM;src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:BricoB;src:url(data:font/woff2;base64,) format('woff2');}
    .t { font-family: ArchivoX; fill: #ffffff; }
    .u { font-family: BricoM; }
    .ub { font-family: BricoB; }
  </style>
  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/></pattern>
    <pattern id="g5" width="200" height="200" patternUnits="userSpaceOnUse"><path d="M200 0H0V200" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/></pattern>
  </defs>
  <rect width="1760" height="520" rx="28" fill="#123a6b"/>
  <rect width="1760" height="520" rx="28" fill="url(#g)"/>
  <rect width="1760" height="520" rx="28" fill="url(#g5)"/>

  <!-- left: words -->
  <text x="84" y="214" class="t" font-size="150" letter-spacing="-2">Measure Once</text>
  <text x="88" y="290" class="u" font-size="40" fill="#dce6f2">Film your window. Get the right size first time.</text>
  <text x="88" y="352" class="u" font-size="28" fill="#9fb4cf">A sizing desk for makers who sell things cut to fit,</text>
  <text x="88" y="392" class="u" font-size="28" fill="#9fb4cf">built on SAM 3.1, Muse Spark, Muse Image and Muse Voice Transcribe.</text>

  <!-- right: elevation drawing -->
  <g transform="translate(1180 78)">
    <!-- pole -->
    <line x1="10" y1="40" x2="490" y2="40" stroke="#f2c230" stroke-width="14" stroke-linecap="round"/>
    <circle cx="6" cy="40" r="15" fill="#f2c230"/><circle cx="494" cy="40" r="15" fill="#f2c230"/>
    <!-- cut marks -->
    <line x1="56" y1="12" x2="56" y2="68" stroke="#d4462b" stroke-width="5"/>
    <line x1="444" y1="12" x2="444" y2="68" stroke="#d4462b" stroke-width="5"/>
    <!-- window -->
    <rect x="90" y="88" width="320" height="250" fill="none" stroke="#ffffff" stroke-width="5"/>
    <rect x="114" y="112" width="272" height="202" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
    <line x1="250" y1="112" x2="250" y2="314" stroke="#ffffff" stroke-opacity="0.45" stroke-width="3"/>
    <!-- A4 -->
    <rect x="18" y="170" width="44" height="62" fill="#ffffff" fill-opacity="0.12" stroke="#f2c230" stroke-width="4"/>
    <text x="40" y="208" class="ub" font-size="18" fill="#f2c230" text-anchor="middle">A4</text>
    <!-- dimension -->
    <line x1="90" y1="372" x2="410" y2="372" stroke="#ffffff" stroke-width="3"/>
    <line x1="90" y1="356" x2="90" y2="388" stroke="#ffffff" stroke-width="3"/>
    <line x1="410" y1="356" x2="410" y2="388" stroke="#ffffff" stroke-width="3"/>
    <rect x="178" y="352" width="144" height="40" rx="6" fill="#123a6b"/>
    <text x="250" y="382" class="ub" font-size="26" fill="#ffffff" text-anchor="middle">219.4 cm</text>
  </g>
</svg>
